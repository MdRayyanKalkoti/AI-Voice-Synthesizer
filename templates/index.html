<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Synthesizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .textarea {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        .textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .textarea::placeholder {
            color: #9ca3af;
        }

        .select-wrapper {
            position: relative;
        }

        .select {
            width: 100%;
            padding: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 12px center;
            background-repeat: no-repeat;
            background-size: 16px;
            padding-right: 40px;
        }

        .select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .audio-container {
            margin-top: 32px;
            padding: 20px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(102, 126, 234, 0.1);
            animation: slideUp 0.5s ease;
        }

        .audio-label {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-control {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            outline: none;
        }

        .audio-control::-webkit-media-controls-panel {
            background-color: #f8fafc;
            border-radius: 12px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 500;
            margin-top: 16px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .voice-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .voice-icon {
            width: 16px;
            height: 16px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
                margin: 10px;
                border-radius: 20px;
            }
            
            .title {
                font-size: 24px;
            }
        }

        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 8s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">🎙️ AI Voice Synthesizer</h1>
            <p class="subtitle">Transform your text into natural speech</p>
        </div>
        
        <form action="/speak" method="POST" id="voiceForm">
            <div class="form-group">
                <label class="label" for="text">Your Message</label>
                <textarea 
                    class="textarea" 
                    name="text" 
                    id="text" 
                    required 
                    placeholder="Type your message here... Express yourself and let AI bring your words to life!"
                    maxlength="500"
                ></textarea>
            </div>
            
            <div class="form-group">
                <label class="label" for="voice">Voice Type</label>
                <div class="select-wrapper">
                    <select class="select" name="voice" id="voice">
 <option value="male" style="color: dodgerblue;">👦🏻 Male Voice</option>
<option value="female" style="color: deeppink;">👩🏻‍🦰 Female Voice</option>


                    </select>
                </div>
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                🚀 Generate Speech
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Processing your request...
            </div>
        </form>
        
        <!-- This would be populated by your Flask template -->
        {% if audio_file %}
<div class="audio-container" id="audioContainer">
    <div class="audio-label">🎵 Generated Audio</div>
    <audio class="audio-control" controls autoplay>
        <source src="{{ url_for('static', filename='audio/' + audio_file) }}" type="audio/wav">
        Your browser does not support the audio element.
    </audio>
    <br><br>
    <a href="{{ url_for('static', filename='audio/' + audio_file) }}" download="{{ audio_file }}">
        ⬇️ Download Audio
    </a>
</div>
{% endif %}
        <div class="loading" id="loading">
            <div class="spinner"></div>
            Processing your request...
        </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (8 + Math.random() * 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Form handling
        document.getElementById('voiceForm').addEventListener('submit', function(e) {
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = '🔄 Generating...';
            loading.classList.add('active');
            
            // Note: In a real implementation, you'd handle the form submission
            // and show the audio when the response comes back
            
            // Simulate loading for demo purposes
            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Generate Speech';
                loading.classList.remove('active');
                
                // Show audio container (in real app, this would be done after successful response)
                document.getElementById('audioContainer').style.display = 'block';
                
                // Simulate audio source (replace with actual Flask template variable)
                // document.getElementById('audioPlayer').src = '...';
            }, 2000);
        });

        // Character counter for textarea
        const textarea = document.getElementById('text');
        textarea.addEventListener('input', function() {
            const remaining = 500 - this.value.length;
            if (remaining < 50) {
                this.style.borderColor = remaining < 0 ? '#ef4444' : '#f59e0b';
            } else {
                this.style.borderColor = '#e5e7eb';
            }
        });

        // Initialize particles
        createParticles();

        // Add subtle hover effects to form elements
        document.querySelectorAll('.textarea, .select').forEach(element => {
            element.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-1px)';
            });
            
            element.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
